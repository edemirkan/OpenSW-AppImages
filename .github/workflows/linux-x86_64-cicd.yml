name: Build, Package and Release Linux x86_64 AppImages

on:
  workflow_call:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      release: ${{ steps.read.outputs.release }}
      release_notes: ${{ steps.read.outputs.release_notes }}
      should_build: ${{ steps.read.outputs.should_build }}
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Install manifest dependencies
        run: sudo apt-get update && sudo apt-get install --yes python3-yaml

      - name: Read upstream release state
        id: read
        env:
          RELEASES_FILE: resources/meta.yml
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACKAGE_BRANCH: ${{ github.ref_name }}
        run: python3 ci/read_releases.py

  build-matrix:
    name: Generate build matrix
    needs: manifest
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.evaluate.outputs.should_build }}
    steps:
      - name: Evaluate upstream release state
        id: evaluate
        env:
          SHOULD_BUILD: ${{ needs.manifest.outputs.should_build }}
          BUILD_MATRIX: ${{ needs.manifest.outputs.matrix }}
        run: |
          if [ "$SHOULD_BUILD" = "true" ]; then
            echo "Upstream does not match current released artifacts, continue..."
            echo "Upstream projects to build:"
            printf '%s' "$BUILD_MATRIX" | jq -r '.[] | "- \(.name) (\(.build_label))"'
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream matches currently released artifacts, noop."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: Build and publish (${{ matrix.name }}, ${{ matrix.build_label }})
    needs:
      - manifest
      - build-matrix
    if: needs.build-matrix.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Configure HTTPS submodule access
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Check out upstream sources
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: source
          submodules: recursive

      - name: Determine source commit
        id: source
        working-directory: source
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine build version
        id: version
        run: |
          version='${{ matrix.version }}'
          if [ -z "$version" ]; then
            version="main-${{ steps.source.outputs.short }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build upstream package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: source
          file: source/packaging/linux/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-args: |
            ${{ matrix.project_prefix }}_BUILD_TYPE=Release
            ${{ matrix.project_prefix }}_VERSION=${{ steps.version.outputs.value }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=linux-${{ matrix.slug }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=linux-{0}', matrix.slug) || '' }}

      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install --yes xz-utils file zsync

      - name: Download appimagetool
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Package AppImage
        env:
          PROJECT_NAME: ${{ matrix.name }}
          BUILD_KIND: ${{ matrix.kind }}
          EXECUTABLE_NAME: ${{ matrix.executable_name }}
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
          DESCRIPTION: ${{ matrix.description }}
          RELEASE_NAME: ${{ matrix.release_name }}
          UPDATE_FILENAME: ${{ matrix.update_filename }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash ci/package_appimage.sh

      - name: Publish project release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ matrix.release_name }}
          RELEASE_TITLE_NAME: ${{ matrix.title_name }}
          RELEASE_TITLE_VALUE: ${{ matrix.title_value }}
          RELEASE_STATE: ${{ matrix.source_state }}
          PACKAGE_BRANCH: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash ci/publish_release.sh
