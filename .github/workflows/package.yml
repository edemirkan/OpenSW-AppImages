name: Package and release AppImages

on:
  workflow_dispatch:
  push:
    paths:
      - resources/release.yml
      - ci/read_releases.py
      - ci/build_appimages.sh
      - ci/publish_release.sh
      - .github/workflows/package.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install --yes python3-yaml xz-utils file zsync

      - name: Read release manifest
        id: manifest
        env:
          RELEASES_FILE: resources/release.yml
        run: |
          python3 ci/read_releases.py

      - name: Download appimagetool
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImages
        env:
          RELEASES: ${{ steps.manifest.outputs.release }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash ci/build_appimages.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.manifest.outputs.release }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash ci/publish_release.sh
