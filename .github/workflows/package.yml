name: Package and release AppImages

on:
  workflow_dispatch:
  push:
    paths:
      - resources/release.yml
      - scripts/read_releases.py
      - .github/workflows/package.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install --yes python3-yaml xz-utils file zsync

      - name: Read release manifest
        id: manifest
        env:
          RELEASES_FILE: resources/release.yml
        run: |
          python3 scripts/read_releases.py

      - name: Download appimagetool
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImages
        env:
          RELEASES: ${{ steps.manifest.outputs.release }}
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p build dist

          while IFS='|' read -r name version download_url description; do
            [ -n "$name" ] || continue
            slug="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]-')"
            workdir="build/${slug}"
            appdir="${workdir}/${slug}.AppDir"

            mkdir -p "$appdir/usr/lib/$slug"
            curl --fail --location --silent --show-error "$download_url" --output "$workdir/release.tar.xz"
            tar --extract --file "$workdir/release.tar.xz" --directory "$appdir/usr/lib/$slug"

            executable="$(find "$appdir/usr/lib/$slug" -type f -perm /111 -print | head -n 1)"
            if [ -z "$executable" ]; then
              echo "No executable found in $download_url" >&2
              exit 1
            fi
            executable_path="${executable#"$appdir/usr/lib/$slug/"}"

            cat > "$appdir/AppRun" <<EOF
          #!/bin/sh
          set -e
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/lib/$slug/$executable_path" "\$@"
          EOF
            chmod +x "$appdir/AppRun"

            cat > "$appdir/$slug.desktop" <<EOF
          [Desktop Entry]
          Name=$name
          Comment=$description
          Exec=$slug
          Icon=$slug
          Type=Application
          Categories=Game;
          EOF
            printf '<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><rect width="256" height="256" fill="#20252b"/><text x="128" y="145" fill="white" font-size="64" text-anchor="middle">%s</text></svg>\n' "$name" > "$appdir/$slug.svg"

            ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run "$appdir" "dist/${slug}-${version}-x86_64.AppImage"
            zsyncmake "dist/${slug}-${version}-x86_64.AppImage" \
              -o "dist/${slug}-${version}-x86_64.AppImage.zsync"
          done <<< "$RELEASES"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="appimages-${GITHUB_SHA::7}"
          gh release create "$tag" dist/* \
            --title "AppImages ${GITHUB_SHA::7}" \
            --notes "AppImages packaged from resources/release.yml at ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"
